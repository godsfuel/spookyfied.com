<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpookyFied.com | Secure Sovereign Gateway</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 0; text-align: center; }
        .header-banner { background-color: #1a1a1a; padding: 20px; border-bottom: 2px solid #333; }
        .header-banner img { max-width: 350px; width: 100%; height: auto; display: block; margin: 0 auto; }
        .container { max-width: 800px; margin: 40px auto; padding: 20px; background: #1e1e1e; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #00ffcc; font-size: 24px; }
        p { color: #b0b0b0; line-height: 1.6; }
        .btn { display: inline-block; background: #00ffcc; color: #121212; padding: 12px 25px; margin: 15px 5px; text-decoration: none; font-weight: bold; border-radius: 4px; transition: background 0.2s; }
        .btn:hover { background: #00cc99; }
        .footer-links { margin-top: 30px; font-size: 14px; }
        .footer-links a { color: #888; margin: 0 10px; text-decoration: none; }
        .footer-links a:hover { color: #00ffcc; }
        .status-box { background: #2a2a2a; padding: 10px; border-radius: 4px; margin-bottom: 20px; font-size: 13px; color: #ff5555; }
    </style>
</head>
<body>

    <div class="header-banner">
        <img src="SPOOKY_Logo.png" alt="Spooky Service Logo">
    </div>

    <div class="container">
        <div id="node-status" class="status-box">Connecting to local gateway node...</div>
        
        <h1>Secure Tunnel Portal</h1>
        <p>Advanced Anti-Spy Tunneling • Securely Protecting Every Byte in Transit.</p>
        
        <div style="margin: 30px 0;">
            <a href="downloads.html" class="btn">Client Installers</a>
            <a href="privacy.html" class="btn">Zero-Retention Policy</a>
            <a href="support.html" class="btn">Node Support Center</a>
        </div>
    </div>

    <div class="footer-links">
        <a href="privacy.html">Privacy Policy</a> | 
        <a href="support.html">Support</a> | 
        <a href="downloads.html">Downloads</a>
    </div>

    <script>
        // Basic check for local gateway node communication
        fetch('http://127.0.0.1:8080/status', { mode: 'no-cors' })
            .then(() => {
                document.getElementById('node-status').style.display = 'none';
            })
            .catch(() => {
                document.getElementById('node-status').innerText = 'Connection error communicating with local gateway node. Ensure background service is running.';
            });
    </script>
</body>
</html>

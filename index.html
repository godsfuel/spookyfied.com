<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpookyFied.com - Sovereign Ecosystem Gateway</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-cyan: #66fcf1;
            --accent-teal: #45a29e;
            --text-main: #c5c6c7;
            --text-bright: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }
        .container {
            background-color: var(--card-bg);
            max-width: 550px;
            width: 90%;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--accent-teal);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        img.logo {
            max-width: 130px;
            height: auto;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--accent-cyan);
            margin-bottom: 5px;
            font-size: 26px;
        }
        p.subtitle {
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 13px;
            color: var(--accent-teal);
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="email"] {
            width: 100%;
            padding: 14px;
            background-color: var(--bg-color);
            color: var(--text-bright);
            border: 1px solid var(--accent-teal);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="email"]:focus {
            border-color: var(--accent-cyan);
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-cyan);
            color: var(--bg-color);
            font-weight: bold;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        button:hover {
            background-color: var(--accent-teal);
            color: var(--text-bright);
        }
        #outputMsg {
            font-size: 13px;
            margin-top: 20px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Make sure SPOOKY_Logo.png is uploaded in the same public directory -->
        <img src="SPOOKY_Logo.png" alt="Spooky Sovereign Logo" class="logo">
        <h1>SpookyFied.com</h1>
        <p class="subtitle">Zero-Retention Sovereign Ecosystem & Secure Gateway</p>
        
        <div class="input-group">
            <label for="userEmail">Authorized Node Identity / Email</label>
            <input type="email" id="userEmail" placeholder="Enter your registered email...">
        </div>
        
        <button onclick="verifyUserAccess()">Access Sovereign Dashboard</button>
        <div id="outputMsg"></div>
    </div>

    <script>
        async function verifyUserAccess() {
            const email = document.getElementById('userEmail').value.trim();
            const msgBox = document.getElementById('outputMsg');
            if (!email) { 
                alert("Please enter a valid email address."); 
                return; 
            }

            msgBox.style.color = "#66fcf1";
            msgBox.textContent = "Verifying cryptographic identity with master node...";

            try {
                const res = await fetch('/api/check-status', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: email })
                });
                const data = await res.json();

                if (data.has_key) {
                    msgBox.textContent = "Spooky Key recognized! Redirecting to secure ecosystem...";
                    setTimeout(() => { window.location.href = `/dashboard?email=${email}`; }, 1000);
                } else {
                    msgBox.textContent = "Provisioning hardware-bound Spooky Key anchor...";
                    const genRes = await fetch('/api/generate-key', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ email: email })
                    });
                    const genData = await genRes.json();
                    msgBox.textContent = "Key provisioned successfully! Loading dashboard...";
                    setTimeout(() => { window.location.href = `/dashboard?email=${email}`; }, 1200);
                }
            } catch (err) {
                msgBox.style.color = "#ff5555";
                msgBox.textContent = "Connection error communicating with local gateway node.";
            }
        }
    </script>
</body>
</html>
